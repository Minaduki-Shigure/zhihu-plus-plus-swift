name: Build fixed IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-fixed-ipa.yml
      - iosApp/**

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        env:
          BUNDLE_ID: com.github.zly2006.zhplus.ios
        run: ./iosApp/scripts/build-sidestore-ipa.sh

      - name: Verify IPA
        run: |
          IPA="build/iosApp/sidestore/ZhihuPlusPlus-SideStore.ipa"
          test -s "$IPA"
          unzip -t "$IPA"
          shasum -a 256 "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: build/iosApp/sidestore/ZhihuPlusPlus-SideStore.ipa
          archive: false
          if-no-files-found: error
